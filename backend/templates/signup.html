<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Recruitment | Signup</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Inter",sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:#0b0f1a;
}

/* animated AI background */
.bg{
  position:absolute;
  width:100%;
  height:100%;
  background:
    radial-gradient(circle at 20% 20%, #6366f1 0%, transparent 40%),
    radial-gradient(circle at 80% 30%, #22d3ee 0%, transparent 40%),
    radial-gradient(circle at 50% 80%, #a855f7 0%, transparent 40%);
  filter: blur(90px);
  animation: move 12s infinite alternate;
}

@keyframes move{
  0%{transform:translate(0,0);}
  100%{transform:translate(40px,-30px);}
}

/* container */
.container{
  display:flex;
  gap:40px;
  z-index:2;
}

/* LEFT BRAND */
.brand{
  color:white;
  width:280px;
}

.brand h1{
  font-size:30px;
  display:flex;
  align-items:center;
  gap:10px;
}

.brand ion-icon{
  font-size:40px;
  color:#60a5fa;
}

.brand p{
  margin-top:15px;
  opacity:0.7;
  line-height:1.5;
}

/* FORM CARD */
.card{
  width:360px;
  padding:30px;
  border-radius:20px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  color:white;
  box-shadow:0 0 40px rgba(0,0,0,0.5);
}

.card h2{
  font-size:24px;
}

.sub{
  font-size:13px;
  opacity:0.6;
  margin-bottom:20px;
}

/* inputs */
.input{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  margin-bottom:12px;
  border-radius:12px;
  background:rgba(255,255,255,0.06);
}

.input input{
  width:100%;
  border:none;
  outline:none;
  background:transparent;
  color:white;
}

.input ion-icon{
  color:#93c5fd;
}

/* ROLE SWITCH */
.roles{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.role-btn{
  flex:1;
  padding:10px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  font-weight:600;
  transition:0.3s;
  background:rgba(255,255,255,0.08);
  color:white;
}

.role-btn.active{
  background:#3b82f6;
}

.role-btn.recruiter.active{
  background:#f97316;
}

.role-btn:hover{
  transform:scale(1.05);
}

/* submit */
button.submit{
  width:100%;
  margin-top:20px;
  padding:12px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#3b82f6,#8b5cf6);
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

button.submit:hover{
  transform:scale(1.05);
  filter:brightness(1.1);
}
.error{
  color:#ff6b6b;
  font-size:12px;
  margin:-8px 0 10px 5px;
  display:block;
}

.input.valid{
  border:1px solid #22c55e;
  box-shadow:0 0 10px rgba(34,197,94,0.2);
}

.input.invalid{
  border:1px solid #ef4444;
  box-shadow:0 0 10px rgba(239,68,68,0.2);
}

button.submit:disabled{
  opacity:0.5;
  cursor:not-allowed;
  transform:none !important;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

  <!-- BRAND -->
  <div class="brand">
    <h1><ion-icon name="sparkles-outline"></ion-icon> AI Recruit</h1>
    <p>
      Join the next generation recruitment system powered by AI resume intelligence,
      smart job matching, and automation.
    </p>
  </div>

  <!-- FORM -->
  <div class="card">

    <h2>Create Account</h2>
    <p class="sub">Start your AI hiring journey</p>

    <div class="input">
      <ion-icon name="person-outline"></ion-icon>
      <input id="fullname" placeholder="Full name">
    </div>
    <small class="error" id="nameError"></small>

    <div class="input">
      <ion-icon name="mail-outline"></ion-icon>
      <input id="email" placeholder="Email">
    </div>
    <small class="error" id="emailError"></small>

    <div class="input">
      <ion-icon name="lock-closed-outline"></ion-icon>
      <input id="password" type="password" placeholder="Password">
    </div>
    <small class="error" id="passError"></small>

    <!-- ROLE -->
    <div class="roles">
      <button type="button" class="role-btn active" onclick="setRole('user', this)">User</button>
      <button type="button" class="role-btn recruiter" onclick="setRole('recruiter', this)">Recruiter</button>
    </div>

    <button class="submit" onclick="register()">Create Account</button>

  </div>

</div>

<script>

let role = "user";

function setRole(r, btn){
  role = r;

  document.querySelectorAll(".role-btn")
    .forEach(b => b.classList.remove("active"));

  btn.classList.add("active");
}

// inputs
const fullname = document.getElementById("fullname");
const emailInput = document.getElementById("email");
const password = document.getElementById("password");
const submitBtn = document.querySelector(".submit");

// errors
const nameError = document.getElementById("nameError");
const emailError = document.getElementById("emailError");
const passError = document.getElementById("passError");

// regex
const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

// ---------------- VALIDATION ----------------

function validateName(){
  const name = fullname.value.trim();

  if(name.length < 3){
    nameError.textContent = "Name must be at least 3 characters";
    return false;
  }

  if(!/^[A-Za-z]+(?:\s+[A-Za-z]+)*$/.test(name)){
    nameError.textContent = "Name can contain letters and spaces only";
    return false;
  }

  nameError.textContent = "";
  return true;
}

function validateEmail(){
  if(!emailPattern.test(emailInput.value.trim())){
    emailError.textContent = "Enter a valid email address";
    return false;
  }
  emailError.textContent = "";
  return true;
}

function validatePassword(){
  const pass = password.value.trim();

  if(pass.length < 6){
    passError.textContent = "Password must be 6+ characters";
    return false;
  }

  if(!/[A-Z]/.test(pass)){
    passError.textContent = "Add at least 1 uppercase letter";
    return false;
  }

  if(!/[0-9]/.test(pass)){
    passError.textContent = "Add at least 1 number";
    return false;
  }

  passError.textContent = "";
  return true;
}

// ---------------- UI STATE ----------------

function updateUI(){

  const valid =
    validateName() &&
    validateEmail() &&
    validatePassword();

  submitBtn.disabled = !valid;
}

// live validation
fullname.addEventListener("input", updateUI);
emailInput.addEventListener("input", updateUI);
password.addEventListener("input", updateUI);

// ---------------- REGISTER ----------------

function register(){

  if(!validateName() || !validateEmail() || !validatePassword()){
    return;
  }

  fetch("/register",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      fullname: fullname.value.trim(),
      email: emailInput.value.trim(),
      password: password.value.trim(),
      role
    })
  })
  .then(r=>r.json())
  .then(d=>{
    alert(d.message);
    if(d.success) window.location.href="/";
  });

}

// init state
updateUI();
</script>
</body>
</html>
