<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Admin Summary Report</title>

    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:"Poppins",sans-serif;
    }


    body{

        background:#0b0f1a;
        color:white;
    }


    .container{

        padding:30px;

    }


    h1{

        margin-bottom:30px;
        color:#60a5fa;

    }


    /* CARDS */

    .cards{

        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:20px;
        margin-bottom:40px;

    }



    .card{

        background:rgba(255,255,255,0.06);
        backdrop-filter:blur(20px);

        padding:25px;

        border-radius:12px;

        border:1px solid rgba(255,255,255,0.08);

        text-align:center;

    }



    .card h2{

        font-size:35px;
        color:#60a5fa;

    }



    .card p{

        color:white;
        font-size:18px;

    }



    /* CHART AREA */


    .charts{

        display:grid;

        grid-template-columns:1fr 1fr;

        gap:25px;

    }



    .chart-box{

        background:rgba(255,255,255,0.06);

        backdrop-filter:blur(20px);

        padding:25px;

        border-radius:12px;

        border:1px solid rgba(255,255,255,0.08);

    }



    .chart-box h3{
        color:#93c5fd;
        margin-bottom:20px;
    }
    canvas{

        max-height:350px;
    }

    </style>


</head>



<body>


<div class="container">


    <h1>
        Admin Summary Report
    </h1>



    <!-- SUMMARY STATISTICS CARDS -->

    <div class="cards">


        <div class="card">

            <h2>{{ total_users }}</h2>
            <p>Total Users</p>

        </div>



        <div class="card">

            <h2>{{ total_recruiters }}</h2>
            <p>Total Recruiters</p>

        </div>



        <div class="card">

            <h2>{{ total_jobs }}</h2>
            <p>Total Jobs</p>

        </div>



        <div class="card">

            <h2>{{ total_applications }}</h2>
            <p>Total Applications</p>

        </div>


    </div>





    <!-- CHARTS -->


    <div class="charts">



        <!-- BAR CHART -->

        <div class="chart-box">

            <h3>
                Platform Statistics
            </h3>

            <canvas id="barChart"></canvas>

        </div>




        <!-- PIE CHART -->


        <div class="chart-box">

            <h3>
                Application Status Distribution
            </h3>

            <canvas id="pieChart"></canvas>

        </div>




        <!-- LINE CHART -->


        <div class="chart-box">

            <h3>
                User Registration Trend
            </h3>

            <canvas id="lineChart"></canvas>

        </div>



    </div>



</div>





<script>


// ==========================
// BAR GRAPH
// ==========================


const barChart = new Chart(
    document.getElementById("barChart"),
    {

        type: "bar",

        data: {

            labels: [
                "Users",
                "Recruiters",
                "Jobs",
                "Applications"
            ],


            datasets: [

                {

                    label: "Total Count",

                    data: [

                        {{ total_users }},
                        {{ total_recruiters }},
                        {{ total_jobs }},
                        {{ total_applications }}

                    ]

                }

            ]

        },


        options: {

            responsive: true

        }

    }

);






// ==========================
// PIE GRAPH
// ==========================


const pieChart = new Chart(

    document.getElementById("pieChart"),

    {

        type: "pie",


        data: {


            labels: [

                "Pending",
                "Shortlisted",
                "Rejected"

            ],


            datasets: [

                {

                    data: [

                        {{ pending }},
                        {{ shortlisted }},
                        {{ rejected }}

                    ]

                }

            ]


        }


    }

);








// ==========================
// LINE GRAPH
// ==========================


const lineChart = new Chart(

    document.getElementById("lineChart"),

    {


        type: "line",


        data: {


            labels: {{ months | tojson }},


            datasets: [

                {


                    label: "New Users",


                    data: {{ user_counts | tojson }},


                    fill: false,


                    tension: 0.3


                }

            ]


        },


        options: {

            responsive: true

        }


    }


);



</script>



</body>

</html>
