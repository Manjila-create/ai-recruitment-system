<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All Users</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  background: #f4f6f9;
  padding: 20px;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

h1 {
  color: #1f2937;
}

/* BUTTON */
button {
  padding: 10px 15px;
  background: #1f2937;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* TABLE CARD */
.table-box {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #1f2937;
  color: white;
  text-align: left;
  padding: 12px;
}

td {
  padding: 12px;
  border-bottom: 1px solid #eee;
}

tr:hover {
  background: #f9fafb;
}

/* BADGES */
.badge-user {
  color: green;
  font-weight: bold;
}

.badge-recruiter {
  color: blue;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="header">
  <h1>Registered Users</h1>
  <button onclick="window.location.href='/admin'">Back</button>
</div>

<div class="table-box">
<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Type</th>
      <th>Joined</th>
    </tr>
  </thead>

  <tbody>
    {% for user in users %}
    <tr>
      <td>{{ user.fullname }}</td>
      <td>{{ user.email }}</td>
      <td><span class="badge-user">User</span></td>
      <td>{{ user.created_at.strftime("%d-%m-%Y %H:%M") }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>

</body>
</html>
