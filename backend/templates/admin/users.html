<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All Users</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6f9;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    button {
      padding: 10px 15px;
      background: #1f2937;
      color: white;
      border: none;
      cursor: pointer;
      margin-bottom: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #1f2937;
      color: white;
    }

    .badge-user {
      color: green;
      font-weight: bold;
    }

    .badge-recruiter {
      color: blue;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Registered Users</h1>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Type</th>
        <th>Joined</th>
      </tr>
    </thead>

    <tbody>

{% for user in users %}
<tr>
    <td>{{ user.fullname }}</td>
    <td>{{ user.email }}</td>
    <td><span class="badge-user">User</span></td>
    <td>{{ user.created_at.strftime("%d-%m-%Y %H:%M") }}</td>
</tr>
{% endfor %}

</tbody>
  </table>
</body>
</html>
