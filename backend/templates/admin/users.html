<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All Users</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}
.search-container{
    margin-bottom:20px;
    display:flex;
    justify-content:flex-end;
}

.search-box{
    width:320px;
    padding:11px 15px;
    border:1px solid #d1d5db;
    border-radius:8px;
    background:white;
    color:#1f2937;
    font-size:14px;
    outline:none;
    transition:.2s;
}

.search-box:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,0.1);
}

.search-box::placeholder{
    color:#9ca3af;
}

.no-results{
    text-align:center;
    padding:25px;
    color:#6b7280;
    display:none;
}
body {
  background: #f4f6f9;
  padding: 20px;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

h1 {
  color: #1f2937;
}

/* BUTTON */
button {
  padding: 10px 15px;
  background: #1f2937;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* TABLE CARD */
.table-box {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #1f2937;
  color: white;
  text-align: left;
  padding: 12px;
}

td {
  padding: 12px;
  border-bottom: 1px solid #eee;
}

tr:hover {
  background: #f9fafb;
}

/* BADGES */
.badge-user {
  color: green;
  font-weight: bold;
}

.badge-recruiter {
  color: blue;
  font-weight: bold;
}
.delete-btn{
    background:#dc2626;
    color:white;
    border:none;
    padding:7px 14px;
    border-radius:6px;
    cursor:pointer;
}

.delete-btn:hover{
    background:#b91c1c;
}
.user-link{
    color:#1f2937;
    text-decoration:none;
    font-weight:600;
    transition:.3s;
}

.user-link:hover{
    color:#2563eb;
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="header">
  <h1>Registered Users</h1>
  <button onclick="window.location.href='/admin'">Back</button>
</div>

<div class="search-container">
    <input
        type="text"
        id="userSearch"
        class="search-box"
        placeholder="Search users by name or email..."
        autocomplete="off"
    >
</div>

<div class="table-box">
<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Type</th>
      <th>Joined</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody id="userTableBody">
    {% for user in users %}
    <tr>

      <td>
          <a class="user-link" href="/user/{{ user.id }}">
              {{ user.fullname }}
          </a>
      </td>

      <td>{{ user.email }}</td>

      <td>
          <span class="badge-user">User</span>
      </td>

      <td>{{ user.created_at.strftime("%d-%m-%Y %H:%M") }}</td>

      <td>
          <form action="{{ url_for('delete_user', user_id=user.id) }}" method="POST">
              <button type="submit"
                      class="delete-btn"
                      onclick="return confirm('Delete this user?')">
                  Delete
              </button>
          </form>
      </td>

  </tr>
    {% endfor %}
  </tbody>
</table>
</div>
<script>

const searchInput = document.getElementById("userSearch");
const tableBody = document.getElementById("userTableBody");

searchInput.addEventListener("input", function(){

    const searchValue = this.value.toLowerCase().trim();

    const rows = tableBody.querySelectorAll("tr");

    let visibleUsers = 0;

    rows.forEach(row => {

        const name = row.cells[0]?.innerText.toLowerCase() || "";
        const email = row.cells[1]?.innerText.toLowerCase() || "";

        if(
            name.includes(searchValue) ||
            email.includes(searchValue)
        ){
            row.style.display = "";
            visibleUsers++;
        }else{
            row.style.display = "none";
        }

    });

    let noResults = document.getElementById("noResults");

    if(visibleUsers === 0 && searchValue !== ""){

        if(!noResults){

            noResults = document.createElement("tr");
            noResults.id = "noResults";

            noResults.innerHTML = `
                <td colspan="5" class="no-results">
                    No users found matching "${searchValue}"
                </td>
            `;

            tableBody.appendChild(noResults);
        }

        noResults.style.display = "table-row";

    }else if(noResults){

        noResults.style.display = "none";

    }

});

</script>
</body>
</html>
