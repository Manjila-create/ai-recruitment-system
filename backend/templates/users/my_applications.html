<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Applications</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

body{
    background:#0b0f1a;
    color:white;
    padding:40px;
}

h1{
    margin-bottom:25px;
    color:#60a5fa;
}

.app-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.app-card{
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(20px);
    border-radius:15px;
    padding:20px;
    border:1px solid rgba(255,255,255,0.08);
    transition:0.3s;
}

.app-card:hover{
    transform:translateY(-5px);
    border-color:#60a5fa;
}

.app-card h3{
    color:#93c5fd;
    margin-bottom:10px;
}

.app-card p{
    color:rgba(255,255,255,0.7);
    margin:5px 0;
}

.status{
    margin-top:10px;
    display:inline-block;
    padding:5px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    background:#3b82f6;
    color:white;
}

</style>
</head>

<body>

<h1>My Applications</h1>

<div class="app-grid">

{% for app, job in data %}

<div class="app-card">

    <h3>{{ job.title }}</h3>
    <p><b>Company:</b> {{ job.company }}</p>
    <p><b>Similarity:</b> {{ app.similarity_score }}%</p>
    <p><b>Skill Match:</b> {{ app.skill_score }}%</p>
    <p><b>Experience:</b> {{ app.experience_score }}%</p>
    <p><b>Final AI Score:</b> {{ app.final_score }}%</p>

    <span class="status">
        {{ app.status }}
    </span>

</div>

{% endfor %}

</div>

</body>
</html>
