<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

body{
    background:#081221;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

/* CARD */
.container{
    width:900px;
    background:#111827;
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
    overflow:hidden;
}

/* HEADER */
.header{
    padding:30px;
    background:linear-gradient(135deg,#2563eb,#0f172a);
    text-align:center;
}

.header h1{
    font-size:28px;
}

/* FORM */
form{
    padding:30px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

label{
    font-size:13px;
    color:#93c5fd;
    margin-bottom:6px;
    display:block;
}

input, textarea{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    outline:none;
    background:#1f2937;
    color:white;
    font-size:14px;
}

textarea{
    resize:none;
    height:90px;
}

.section-title{
    margin:20px 0 10px;
    color:#60a5fa;
    font-weight:600;
}

/* PROFILE PIC */
.pic-box{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
}

.preview{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #2563eb;
}

.default{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:700;
}

/* BUTTONS */
.buttons{
    display:flex;
    gap:15px;
    margin-top:25px;
}

.btn{
    flex:1;
    padding:14px;
    border-radius:12px;
    text-align:center;
    border:none;
    cursor:pointer;
    font-weight:600;
    font-size:15px;
    text-decoration:none;
}

.save{
    background:#2563eb;
    color:white;
}

.cancel{
    background:#374151;
    color:white;
}

/* ERROR */
.error{
    background:#7f1d1d;
    padding:10px;
    border-radius:10px;
    margin-bottom:15px;
    color:#fecaca;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>Edit Profile</h1>
</div>

<form method="POST" enctype="multipart/form-data">

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<!-- PROFILE PIC -->
<div class="pic-box">

{% if user.profile_pic and user.profile_pic != "profile_pics/default.png" %}
<img src="{{ url_for('static', filename=user.profile_pic) }}" class="preview">
{% else %}
<div class="default">
{{ user.fullname[0]|upper }}
</div>
{% endif %}

<div>
<label>Profile Picture</label>
<input type="file" name="profile_pic">
</div>

</div>

<!-- PERSONAL INFO -->
<div class="section-title">Personal Information</div>

<div class="grid">

<div>
<label>Full Name</label>
<input type="text" name="fullname" value="{{ user.fullname }}">
</div>

<div>
<label>Email (read only)</label>
<input type="text" value="{{ user.email }}" disabled>
</div>

<div>
<label>Phone</label>
<input type="text" name="phone" value="{{ user.phone or '' }}">
</div>

<div>
<label>Location</label>
<input type="text" name="location" value="{{ user.location or '' }}">
</div>

<div>
<label>Date of Birth</label>
<input type="date" name="dob" value="{{ user.dob }}">
</div>

</div>

<!-- PROFESSIONAL INFO -->
<div class="section-title">Professional Information</div>

<div class="grid">

<div>
<label>Headline</label>
<input type="text" name="headline" value="{{ user.headline or '' }}">
</div>

<div>
<label>Skills</label>
<input type="text" name="skills" value="{{ user.skills or '' }}">
</div>

<div>
<label>Education</label>
<textarea name="education">{{ user.education or '' }}</textarea>
</div>

<div>
<label>Experience</label>
<textarea name="experience">{{ user.experience or '' }}</textarea>
</div>

</div>

<!-- BUTTONS -->
<div class="buttons">

<button type="submit" class="btn save">
Save Changes
</button>

<a href="/profile" class="btn cancel">
Cancel
</a>

</div>

</form>

</div>

</body>
</html>
