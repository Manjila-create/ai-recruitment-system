<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resume Upload</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

body{
    background:#0b0f1a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:500px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(20px);
    padding:30px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.08);
}

h2{
    color:#60a5fa;
    margin-bottom:20px;
}

input[type="file"]{
    width:100%;
    padding:10px;
    background:rgba(255,255,255,0.05);
    border-radius:10px;
    color:white;
}

button{
    margin-top:15px;
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#3b82f6;
    color:white;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    background:#2563eb;
}

a{
    color:#93c5fd;
    font-weight:600;
}

hr{
    margin:20px 0;
    border:1px solid rgba(255,255,255,0.1);
}

p{
    color:rgba(255,255,255,0.7);
}

</style>
</head>

<body>

<div class="box">

    <h2>Upload Resume</h2>

    <form method="POST" enctype="multipart/form-data">

        <input type="file" name="resume" accept=".pdf" required>

        <button type="submit">Upload</button>

    </form>

    <hr>

    {% if user.resume %}

        <p><b>Current Resume:</b></p>

        <a href="{{ url_for('static', filename='resumes/' + user.resume) }}" target="_blank">
            View Resume
        </a>

    {% else %}

        <p>No resume uploaded yet.</p>

    {% endif %}

</div>

</body>
</html>
