<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

body{
    background:#0b0f1a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* PROFILE CARD */
.card{
    width:420px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(20px);
    border-radius:20px;
    padding:30px;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 0 25px rgba(0,0,0,0.3);
}

h1{
    color:#60a5fa;
    margin-bottom:20px;
    text-align:center;
}

.info{
    margin:12px 0;
    color:rgba(255,255,255,0.8);
    font-size:15px;
}

.info strong{
    color:#93c5fd;
}

/* BUTTON */
a{
    display:block;
    text-align:center;
    margin-top:25px;
    padding:12px;
    border-radius:12px;
    text-decoration:none;
    background:#3b82f6;
    color:white;
    font-weight:600;
    transition:0.3s;
}

a:hover{
    background:#2563eb;
    transform:translateY(-2px);
}

</style>
</head>

<body>

<div class="card">

    <h1>My Profile</h1>

    <div class="info">
        <strong>Full Name:</strong> {{ user.fullname }}
    </div>

    <div class="info">
        <strong>Email:</strong> {{ user.email }}
    </div>

    <div class="info">
        <strong>Member Since:</strong> 
        {% if user.created_at %}
            {{ user.created_at.strftime('%d %B %Y') }}
        {% else %}
            N/A
        {% endif %}
    </div>

    <a href="/user">Back to Dashboard</a>

</div>

</body>
</html>
