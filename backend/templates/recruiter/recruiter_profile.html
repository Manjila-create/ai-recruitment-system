<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recruiter Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0b1120;
color:white;
padding:40px;
}

body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at top left,#2563eb33,transparent 40%),
radial-gradient(circle at bottom right,#7c3aed33,transparent 40%);
filter:blur(80px);
z-index:-1;
}

.container{
max-width:900px;
margin:auto;
}

.profile-card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
padding:35px;
box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.header{
display:flex;
align-items:center;
gap:25px;
margin-bottom:35px;
}

.avatar{
width:95px;
height:95px;
border-radius:50%;
background:linear-gradient(135deg,#3b82f6,#6366f1);
display:flex;
justify-content:center;
align-items:center;
font-size:36px;
font-weight:700;
color:white;
flex-shrink:0;
}

.info h1{
font-size:30px;
margin-bottom:5px;
}

.info p{
color:#94a3b8;
font-size:15px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
margin-top:25px;
}

.card{
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.06);
padding:18px;
border-radius:14px;
}

.card h3{
font-size:13px;
color:#60a5fa;
margin-bottom:8px;
text-transform:uppercase;
letter-spacing:1px;
}

.card p{
font-size:15px;
color:#e2e8f0;
word-break:break-word;
}

.actions{
margin-top:35px;
display:flex;
gap:15px;
}

.btn{
text-decoration:none;
padding:12px 22px;
border-radius:10px;
font-weight:500;
transition:.3s;
}

.primary{
background:#2563eb;
color:white;
}

.primary:hover{
background:#1d4ed8;
}

.secondary{
background:rgba(255,255,255,.08);
color:white;
}

.secondary:hover{
background:rgba(255,255,255,.14);
}

@media(max-width:700px){

.header{
flex-direction:column;
text-align:center;
}

.grid{
grid-template-columns:1fr;
}

.actions{
justify-content:center;
flex-wrap:wrap;
}

}

</style>
</head>

<body>

<div class="container">

<div class="profile-card">

<div class="header">

<div class="avatar">
{{ recruiter.fullname[0]|upper }}
</div>

<div class="info">
<h1>{{ recruiter.fullname }}</h1>
<p>Recruiter Account</p>
</div>

</div>

<div class="grid">

<div class="card">
<h3>Full Name</h3>
<p>{{ recruiter.fullname }}</p>
</div>

<div class="card">
<h3>Email Address</h3>
<p>{{ recruiter.email }}</p>
</div>

<div class="card">
<h3>Account Type</h3>
<p>Recruiter</p>
</div>

<div class="card">
<h3>Member Since</h3>
<p>{{ recruiter.created_at.strftime('%d %B %Y') }}</p>
</div>

</div>

<div class="actions">
<a href="/recruiter" class="btn primary">← Back to Dashboard</a>
</div>

</div>

</div>

</body>
</html>
