<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Post Jobs</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0b0f1a;
    color:white;
}

.bg{
    position:fixed;
    width:100%;
    height:100%;
    background:
        radial-gradient(circle at 20% 20%, #6366f1 0%, transparent 40%),
        radial-gradient(circle at 80% 30%, #22d3ee 0%, transparent 40%),
        radial-gradient(circle at 50% 80%, #a855f7 0%, transparent 40%);
    filter:blur(90px);
    animation:move 12s infinite alternate;
    z-index:-1;
}

@keyframes move{
    from{transform:translate(0,0);}
    to{transform:translate(40px,-30px);}
}

.container{
    width:90%;
    max-width:700px;
    margin:50px auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.header h1{
    color:white;
}

.logout-btn{
    background:#ef4444;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.logout-btn:hover{
    background:#dc2626;
}

/* FORM CARD */
.card{
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    padding:30px;
}

.card h2{
    margin-bottom:20px;
    color:#60a5fa;
}

input, textarea{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    color:white;
    font-size:15px;
}
.salary-group{
    margin-bottom:15px;
}

.salary-group input[type="number"]{
    width:100%;
}

.checkbox{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:8px;
    color:#cbd5e1;
    cursor:pointer;
    font-size:15px;
}

.checkbox input[type="checkbox"]{
    width:18px;
    height:18px;
    margin:0;
    accent-color:#3b82f6;
    cursor:pointer;
    flex-shrink:0;
}
input::placeholder,
textarea::placeholder{
    color:#cbd5e1;
}

textarea{
    resize:none;
    height:120px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#3b82f6,#8b5cf6);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.03);
    filter:brightness(1.1);
}

hr{
    margin-top:25px;
    border:0;
    border-top:1px solid rgba(255,255,255,0.1);
}

</style>

</head>
<body>

<div class="bg"></div>

<div class="container">

<div class="header">
    <h1>Post Jobs</h1>

    <a href="/recruiter">
        <button class="logout-btn">Back</button>
    </a>
</div>

<div class="card">

    <h2>Create New Job</h2>

    <form action="/create-job" method="POST">

        <input name="title" placeholder="Job Title" required>
        <input name="company" placeholder="Company Name" required>
        <input name="location" placeholder="Location" required>
        <div class="salary-group">

            <input
                type="number"
                id="salaryInput"
                placeholder="Salary (NPR)"
                min="1"
                required>

            <label class="checkbox">
                <input type="checkbox" id="negotiable">
                <span>Negotiable</span>
            </label>

            <input type="hidden" name="salary" id="salaryHidden">

        </div>

        <textarea name="description" placeholder="Job Description"></textarea>

        <button type="submit">Post Job</button>

    </form>

    <hr>

</div>

</div>
<script>

const salaryInput = document.getElementById("salaryInput");
const negotiable = document.getElementById("negotiable");
const hiddenSalary = document.getElementById("salaryHidden");
const form = document.querySelector("form");

negotiable.addEventListener("change", () => {

    salaryInput.disabled = negotiable.checked;
    salaryInput.required = !negotiable.checked;

    if(negotiable.checked){
        salaryInput.value = "";
    }

});

form.addEventListener("submit",(e)=>{

    if(negotiable.checked){
        hiddenSalary.value="Negotiable";
    }else{

        if(Number(salaryInput.value)<=0){
            alert("Salary must be greater than 0.");
            e.preventDefault();
            return;
        }

        hiddenSalary.value=salaryInput.value;
    }

});

</script>
</body>
</html>
