<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registered Candidates</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0b0f1a;
    color:white;
}

.bg{
    position:fixed;
    width:100%;
    height:100%;
    background:
        radial-gradient(circle at 20% 20%, #6366f1 0%, transparent 40%),
        radial-gradient(circle at 80% 30%, #22d3ee 0%, transparent 40%),
        radial-gradient(circle at 50% 80%, #a855f7 0%, transparent 40%);
    filter:blur(90px);
    animation:move 12s infinite alternate;
    z-index:-1;
}

@keyframes move{
    from{transform:translate(0,0);}
    to{transform:translate(40px,-30px);}
}

.container{
    width:90%;
    max-width:1000px;
    margin:40px auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.header h1{
    color:white;
}

.logout-btn{
    background:#ef4444;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.logout-btn:hover{
    background:#dc2626;
}

.card{
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 25px rgba(96,165,250,.2);
}

.card h2{
    margin-bottom:10px;
}

.card h2 a{
    color:#60a5fa;
    text-decoration:none;
}

.card h2 a:hover{
    text-decoration:underline;
}

.card p{
    color:#d1d5db;
}

.view-btn{
    display:inline-block;
    margin-top:15px;
    padding:10px 18px;
    background:#3b82f6;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:600;
}

.view-btn:hover{
    background:#2563eb;
}

</style>

</head>
<body>

<div class="bg"></div>

<div class="container">

<div class="header">

<h1>All Registered Candidates</h1>

<a href="/recruiter">
<button class="logout-btn">Back</button></a>

</div>

{% for user in users %}

<div class="card">

<h2>
<a href="/candidate/{{ user.id }}">
{{ user.fullname }}
</a>
</h2>

<p>{{ user.email }}</p>

<a class="view-btn" href="/candidate/{{ user.id }}">
View Profile
</a>

</div>

{% endfor %}

</div>

</body>
</html>
