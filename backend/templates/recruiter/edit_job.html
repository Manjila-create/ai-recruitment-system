<!DOCTYPE html>
<html>
<head>

    <title>Edit Job</title>

    <style>

        body{
            font-family:Poppins,sans-serif;
            background:#eef2ff;
            padding:40px;
        }

        .box{

            width:650px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 0 10px rgba(0,0,0,.15);

        }

        input,
        textarea{

            width:100%;
            padding:10px;
            margin-bottom:15px;

        }

        button{

            background:#3e4684;
            color:white;
            border:none;
            padding:12px 20px;
            cursor:pointer;
            border-radius:8px;

        }

    </style>

</head>

<body>

<div class="box">

<h2>Edit Job</h2>

<form method="POST">

<input
type="text"
name="title"
value="{{ job.title }}"
required>

<input
type="text"
name="company"
value="{{ job.company }}"
required>

<input
type="text"
name="location"
value="{{ job.location }}"
required>

<input
type="text"
name="salary"
value="{{ job.salary }}"
required>

<textarea
name="description"
rows="8"
required>{{ job.description }}</textarea>

<button type="submit">

Update Job

</button>

</form>

</div>

</body>
</html>
