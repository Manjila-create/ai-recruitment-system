<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Job</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0b0f1a;
    color:white;
}

.bg{
    position:fixed;
    width:100%;
    height:100%;
    background:
        radial-gradient(circle at 20% 20%, #6366f1 0%, transparent 40%),
        radial-gradient(circle at 80% 30%, #22d3ee 0%, transparent 40%),
        radial-gradient(circle at 50% 80%, #a855f7 0%, transparent 40%);
    filter:blur(90px);
    animation:move 12s infinite alternate;
    z-index:-1;
}

@keyframes move{
    from{transform:translate(0,0);}
    to{transform:translate(40px,-30px);}
}

.container{
    width:90%;
    max-width:800px;
    margin:50px auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.header h1{
    color:white;
}

.logout-btn{
    background:#ef4444;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:.3s;
}

.logout-btn:hover{
    background:#dc2626;
}

.card{
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:35px;
    box-shadow:0 0 25px rgba(0,0,0,.35);
}

.card h2{
    margin-bottom:25px;
    color:#60a5fa;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:500;
}

input,
textarea{
    width:100%;
    padding:14px;
    margin-bottom:20px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,.08);
    color:white;
    font-size:15px;
}

textarea{
    resize:vertical;
}

input::placeholder,
textarea::placeholder{
    color:#cbd5e1;
}

.btn-group{
    display:flex;
    gap:15px;
    margin-top:10px;
}

.save-btn{
    background:#22c55e;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    transition:.3s;
}

.save-btn:hover{
    background:#16a34a;
}

.cancel-btn{
    background:#475569;
    color:white;
    text-decoration:none;
    padding:12px 25px;
    border-radius:10px;
    font-weight:600;
    transition:.3s;
}
.salary-group{
    margin-bottom:20px;
}

.salary-group #salaryInput{
    margin-bottom:10px;
}

.checkbox{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:20px;
    cursor:pointer;
}

.checkbox input{
    width:auto;
    margin:0;
    accent-color:#22c55e;
    cursor:pointer;
}

.checkbox span{
    font-size:14px;
    color:#cbd5e1;
}

.cancel-btn:hover{
    background:#334155;
}

</style>

</head>
<body>

<div class="bg"></div>

<div class="container">

<div class="header">

<h1>Edit Job</h1>

<a href="/recruiter">
<button class="logout-btn">Back</button>
</a>

</div>

<div class="card">

<h2>Update Job Details</h2>

<form method="POST">

<label>Job Title</label>
<input
type="text"
name="title"
value="{{ job.title }}"
required>

<label>Company</label>
<input
type="text"
name="company"
value="{{ job.company }}"
required>

<label>Location</label>
<input
type="text"
name="location"
value="{{ job.location }}"
required>

<label>Salary</label>

<div class="salary-group">

    <input type="number" id="salaryInput" placeholder="Salary (NPR)" min="100"
        step="1"
        {% if job.salary != "Negotiable" %}
        value="{{ job.salary }}"
        required
        {% endif %}
    >

    <label class="checkbox">
        <input type="checkbox" id="negotiable"
            {% if job.salary == "Negotiable" %}checked{% endif %}
        >
        <span>Negotiable</span>
    </label>

    <input
        type="hidden" name="salary" id="salaryHidden" value="{{ job.salary }}">

</div>

<label>Description</label>
<textarea
name="description"
rows="8"
required>{{ job.description }}</textarea>

<div class="btn-group">

<button class="save-btn" type="submit">
Save Changes
</button>

<a class="cancel-btn" href="/posted-jobs">
Cancel
</a>

</div>
</form>
</div></div>
<script>

const salaryInput = document.getElementById("salaryInput");
const negotiable = document.getElementById("negotiable");
const hiddenSalary = document.getElementById("salaryHidden");
const form = document.querySelector("form");

// Handle existing "Negotiable" salary
if (negotiable.checked) {
    salaryInput.disabled = true;
    salaryInput.required = false;
    hiddenSalary.value = "Negotiable";
}

// Toggle Negotiable
negotiable.addEventListener("change", () => {

    if (negotiable.checked) {

        salaryInput.disabled = true;
        salaryInput.required = false;
        salaryInput.value = "";

        hiddenSalary.value = "Negotiable";

    } else {

        salaryInput.disabled = false;
        salaryInput.required = true;

        hiddenSalary.value = "";

        salaryInput.focus();
    }

});

form.addEventListener("submit", (e) => {

    // Negotiable
    if (negotiable.checked) {
        hiddenSalary.value = "Negotiable";
        return;
    }

    // Get salary
    const salary = salaryInput.value.trim();

    // Empty salary
    if (salary === "") {
        e.preventDefault();
        alert("Please enter a salary.");
        salaryInput.focus();
        return;
    }

    // Convert to number
    const salaryNumber = Number(salary);

    // Invalid, zero, or negative salary
    if (!Number.isFinite(salaryNumber) || salaryNumber <= 0) {
        e.preventDefault();
        alert("Salary must be greater than 0.");
        salaryInput.focus();
        return;
    }

    // Valid salary
    hiddenSalary.value = salaryNumber;

});

</script>
</body>
</html>
