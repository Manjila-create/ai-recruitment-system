<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Posted Jobs</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0b0f1a;
    color:white;
}

.bg{
    position:fixed;
    width:100%;
    height:100%;
    background:
        radial-gradient(circle at 20% 20%, #6366f1 0%, transparent 40%),
        radial-gradient(circle at 80% 30%, #22d3ee 0%, transparent 40%),
        radial-gradient(circle at 50% 80%, #a855f7 0%, transparent 40%);
    filter:blur(90px);
    animation:move 12s infinite alternate;
    z-index:-1;
}

@keyframes move{
    from{transform:translate(0,0);}
    to{transform:translate(40px,-30px);}
}

.container{
    width:90%;
    max-width:1000px;
    margin:50px auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.header h1{
    color:white;
}

.logout-btn{
    background:#ef4444;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}

.logout-btn:hover{
    background:#dc2626;
}

/* JOB CARD */
.job{
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    padding:25px;
    margin-bottom:20px;
    transition:0.3s;
}

.job:hover{
    transform:translateY(-5px);
    box-shadow:0 0 25px rgba(96,165,250,0.2);
}

.job h2{
    color:#60a5fa;
    margin-bottom:10px;
}

.job p{
    color:#d1d5db;
    margin:6px 0;
}

.actions{
    margin-top:15px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
    text-decoration:none;
    display:inline-block;
}

/* EDIT */
.edit{
    background:#3b82f6;
    color:white;
}

.edit:hover{
    background:#2563eb;
}

/* DELETE */
.delete{
    background:#ef4444;
    color:white;
}

.delete:hover{
    background:#dc2626;
}

/* LOGOUT */
.logout{
    background:#ef4444;
    color:white;
}

</style>

</head>
<body>

<div class="bg"></div>

<div class="container">

<div class="header">

<h1>My Posted Jobs</h1>

<a href="/logout">
<button class="logout-btn">Logout</button>
</a>

</div>

{% for job in jobs %}

<div class="job">

<h2>{{ job.title }}</h2>

<p><strong>Company:</strong> {{ job.company }}</p>
<p><strong>Location:</strong> {{ job.location }}</p>
<p><strong>Salary:</strong> {{ job.salary }}</p>

<p>{{ job.description }}</p>

<div class="actions">

<a href="/edit-job/{{ job.id }}" class="btn edit">
Edit
</a>

<form action="/delete-job/{{ job.id }}" method="POST">
<button class="btn delete" onclick="return confirm('Delete this job?')">
Delete
</button>
</form>

</div>

</div>

{% endfor %}

</div>

</body>
</html>
