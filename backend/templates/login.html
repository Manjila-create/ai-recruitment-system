<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Recruitment System</title>

<script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- Animated background -->
<div class="bg-animation"></div>

<div class="main-container">

  <!-- LEFT SIDE BRAND -->
  <div class="brand-panel">
    <div class="logo-box">
      <ion-icon name="hardware-chip-outline"></ion-icon>
      <h1>AI Recruit</h1>
    </div>

    <p class="tagline">
      Smarter hiring powered by AI matching, resume intelligence & automation.
    </p>

    <div class="floating-cards">
      <div class="card">⚡ Instant Matching</div>
      <div class="card">📄 Resume AI Scan</div>
      <div class="card">🎯 Smart Hiring</div>
    </div>
  </div>

  <!-- LOGIN CARD -->
  <div class="login-card">

    <h2>Welcome Back</h2>
    <p class="sub">Login to continue your recruitment journey</p>

    <!-- EMAIL -->
    <div class="input-box">
      <ion-icon name="mail-outline"></ion-icon>
      <input id="email" type="email" placeholder="Email address">
    </div>

    <!-- PASSWORD -->
    <div class="input-box">
      <ion-icon name="lock-closed-outline"></ion-icon>
      <input id="password" type="password" placeholder="Password">
    </div>

    <!-- BUTTONS -->
    <div class="btn-group">
      <button onclick="login('user')" class="btn user">User Login</button>
      <button onclick="login('recruiter')" class="btn recruiter">Recruiter Login</button>
    </div>

    <div class="links">
      <a href="{{ url_for('signup') }}">Create Account</a>
      <span>Forgot password?</span>
    </div>

  </div>

</div>

<script>
function login(role){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  fetch("/login", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({email,password,role})
  })
  .then(r=>r.json())
  .then(d=>{
    if(d.success) window.location.href = d.redirect;
    else alert(d.message);
  });
}
</script>

</body>
</html>
