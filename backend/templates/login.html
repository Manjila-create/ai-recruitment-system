<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recruitment System</title>

  <!-- Icons -->
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Normalize -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">

  <!-- Flask CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="screen-1">

  <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
    <g transform="matrix(3.31 0 0 3.31 320.4 240.4)">
      <circle cx="0" cy="0" r="40"></circle>
    </g>
    <g transform="matrix(0.98 0 0 0.98 268.7 213.7)">
      <circle cx="0" cy="0" r="40"></circle>
    </g>
    <g transform="matrix(1.01 0 0 1.01 362.9 210.9)">
      <circle cx="0" cy="0" r="40"></circle>
    </g>
    <g transform="matrix(0.92 0 0 0.92 318.5 286.5)">
      <circle cx="0" cy="0" r="40"></circle>
    </g>
  </svg>

  <!-- EMAIL -->
  <div class="email">
    <label>Email Address</label>
    <div class="sec-2">
      <ion-icon name="mail-outline"></ion-icon>
      <input id="email" name="email" type="email" placeholder="Username@gmail.com">
    </div>
  </div>

  <!-- PASSWORD -->
  <div class="password">
    <label>Password</label>
    <div class="sec-2">
      <ion-icon name="lock-closed-outline"></ion-icon>
      <input id="password" name="password" type="password" class="pas" placeholder="············">
      <ion-icon class="show-hide" name="eye-outline"></ion-icon>
    </div>
  </div>

  <!-- LOGIN BUTTON -->
  <div class="login-dropdown">

    <button class="login-btn" type="button" onclick="login()">Login</button>

    <div class="dropdown-content">

      <a href="{{ url_for('user') }}">
        <button type="button" class="option-btn">User Login</button>
      </a>

      <a href="{{ url_for('recruiter') }}">
        <button type="button" class="option-btn recruiter">Recruiter Login</button>
      </a>

    </div>

  </div>

  <div class="footer">
    <span>Signup</span>
    <span>Forgot Password?</span>
  </div>

</div>

<!-- JS LOGIN LOGIC -->
<script>
function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  fetch("/login", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ email, password })
  })
  .then(res => res.json())
  .then(data => {
    if (data.redirect) {
      window.location.href = data.redirect;
    }
  });
}
</script>

</body>
</html>
